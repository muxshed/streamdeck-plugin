<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Host / IP">
			<sdpi-textfield setting="host" global default="127.0.0.1" placeholder="127.0.0.1"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Port">
			<sdpi-textfield setting="port" global default="8080" placeholder="8080"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="API key">
			<sdpi-password setting="apikey" global></sdpi-password>
		</sdpi-item>
		<sdpi-item>
			<sdpi-message>Create an API key in the Muxshed studio under Settings → API Keys.</sdpi-message>
		</sdpi-item>
	</body>
</html>
